
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SpendWise - Personal Expense Tracker</title>

    <!-- Connect CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Connect JavaScript -->
    <script src="script.js" defer></script>
</head>

<body>

    <!-- HEADER SECTION -->
    <header>
        <h1>SpendWise</h1>
        <p>Personal Expense Tracker - Manage Your Money Wisely</p>
    </header>

    <!-- MAIN CONTENT -->
    <main>

        <!-- FINANCIAL SUMMARY SECTION -->
        <section class="summary">

            <div class="summary-card">
                <h3>Total Income</h3>
                <p id="totalIncome">KSh 0.00</p>
            </div>

            <div class="summary-card">
                <h3>Total Expenses</h3>
                <p id="totalExpenses">KSh 0.00</p>
            </div>

            <div class="summary-card">
                <h3>Available Balance</h3>
                <p id="balance">KSh 0.00</p>
            </div>

        </section>

        <!-- ADD TRANSACTION SECTION -->
        <section class="form-section">

            <h2>Add New Transaction</h2>

            <form id="transactionForm">

                <!-- Transaction Description -->
                <label for="description">
                    Transaction Description
                </label>

                <input
                    type="text"
                    id="description"
                    placeholder="Enter transaction description"
                    required
                >

                <!-- Transaction Amount -->
                <label for="amount">
                    Amount (KSh)
                </label>

                <input
                    type="number"
                    id="amount"
                    placeholder="Enter amount"
                    min="0.01"
                    step="0.01"
                    required
                >

                <!-- Transaction Type -->
                <label for="type">
                    Transaction Type
                </label>

                <select id="type" required>
                    <option value="expense">Expense</option>
                    <option value="income">Income</option>
                </select>

                <!-- Transaction Category -->
                <label for="category">
                    Category
                </label>

                <select id="category" required>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Rent">Rent</option>
                    <option value="Education">Education</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Utilities">Utilities</option>
                    <option value="Salary">Salary</option>
                    <option value="Other">Other</option>
                </select>

                <!-- Transaction Date -->
                <label for="date">
                    Transaction Date
                </label>

                <input
                    type="date"
                    id="date"
                    required
                >

                <!-- Submit Button -->
                <button type="submit">
                    Add Transaction
                </button>

            </form>

        </section>

        <!-- TRANSACTION HISTORY SECTION -->
        <section class="transactions-section">

            <h2>Transaction History</h2>

            <div id="transactionList">
                <p>No transactions yet.</p>
            </div>

        </section>

    </main>

    <!-- FOOTER SECTION -->
    <footer>
        <p>
            copy; 2026 SpendWise.
            All Rights Reserved.
        </p>

        <p>Personal Expense Tracker</p>
    </footer>

</body>
</html>
